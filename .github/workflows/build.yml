name: Build iOS IPAs

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode 26 build and tests
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install build tools
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          if ! command -v ldid >/dev/null 2>&1; then
            brew install ldid
          fi
          xcodegen --version
          command -v ldid

      - name: Validate browser viewer
        run: |
          node scripts/validate-browser-viewer.mjs
          node scripts/test-browser-lifecycle.mjs

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests
        run: bash scripts/test.sh

      - name: Build sender
        run: |
          xcodebuild \
            -project ScreenShare.xcodeproj \
            -scheme ScreenShareSender \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build receiver
        run: |
          xcodebuild \
            -project ScreenShare.xcodeproj \
            -scheme ScreenShareReceiver \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .derived-data \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Embed TrollStore sender entitlements
        run: |
          bash scripts/fakesign-trollstore.sh \
            '.derived-data/Build/Products/Release-iphoneos/Screen Share Sender.app'

      - name: Verify packaged declarations and extension
        run: |
          sender_info='.derived-data/Build/Products/Release-iphoneos/Screen Share Sender.app/Info.plist'
          receiver_info='.derived-data/Build/Products/Release-iphoneos/ScreenShareReceiver.app/Info.plist'
          broadcast_app='.derived-data/Build/Products/Release-iphoneos/Screen Share Sender.app/PlugIns/ScreenShareBroadcast.appex'
          broadcast_info="${broadcast_app}/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' "${sender_info}")" = '_screenshare._tcp'
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "${sender_info}")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' "${receiver_info}")" = '_screenshare._tcp'
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' "${receiver_info}")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "${receiver_info}")" = 'audio'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIStatusBarHidden' "${receiver_info}")" = 'true'
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIViewControllerBasedStatusBarAppearance' "${receiver_info}")" = 'false'
          test -x "${broadcast_app}/ScreenShareBroadcast"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "${broadcast_info}")" = 'com.apple.broadcast-services-upload'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${broadcast_info}")" = 'dev.screenshare.sender.broadcast.v17'
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:RPBroadcastProcessMode' "${broadcast_info}")" = 'RPBroadcastProcessModeSampleBuffer'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' build/embedded-entitlements/sender.plist)" = 'group.dev.screenshare.sender'
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' build/embedded-entitlements/broadcast.plist)" = 'group.dev.screenshare.sender'

      - name: Package sideloadable IPAs
        run: |
          mkdir -p build
          bash scripts/package-ipa.sh \
            '.derived-data/Build/Products/Release-iphoneos/Screen Share Sender.app' \
            'build/ScreenShare-Sender-unsigned.ipa'
          bash scripts/package-ipa.sh \
            '.derived-data/Build/Products/Release-iphoneos/ScreenShareReceiver.app' \
            'build/ScreenShare-Receiver-unsigned.ipa'
          shasum -a 256 build/*.ipa > build/SHA256SUMS.txt

      - name: Upload build artifacts
        id: upload_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShare-${{ github.sha }}
          path: |
            build/*.ipa
            build/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish CI prerelease fallback
        if: steps.upload_artifact.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/_' '--')"
          ci_tag="ci-${safe_ref}"
          if gh release view "${ci_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/git/refs/tags/${ci_tag}" \
              -f sha="${GITHUB_SHA}" \
              -F force=true
            gh release upload "${ci_tag}" \
              build/*.ipa \
              build/SHA256SUMS.txt \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${ci_tag}" \
              build/*.ipa \
              build/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Screen Share CI (${GITHUB_REF_NAME})" \
              --notes "Unsigned CI build for ${GITHUB_REF_NAME} at ${GITHUB_SHA}." \
              --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Report pull request artifact fallback
        if: steps.upload_artifact.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          echo "::warning::Actions artifact storage is unavailable. The matching branch push publishes the IPAs to its rolling CI prerelease."

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        id: download_artifact
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ScreenShare-${{ github.sha }}
          path: build

      - name: Download CI prerelease fallback
        if: steps.download_artifact.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          safe_ref="$(printf '%s' "${GITHUB_REF_NAME}" | tr '/_' '--')"
          mkdir -p build
          gh release download "ci-${safe_ref}" \
            --pattern '*.ipa' \
            --pattern 'SHA256SUMS.txt' \
            --dir build \
            --repo "${GITHUB_REPOSITORY}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            build/*.ipa \
            build/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "Screen Share ${GITHUB_REF_NAME}"
